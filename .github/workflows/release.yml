name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
      - name: Verify tag and build package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          RELEASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$RELEASE_VERSION"
          test "v$RELEASE_VERSION" = "$GITHUB_REF_NAME"
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"
          ./gradlew --no-daemon -PreleaseVersion="$RELEASE_VERSION" spotlessCheck detekt apiCheck buildHealth check assemble publishAllPublicationsToLocalRepository
          mkdir -p release
      - name: Publish signed Maven packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon -PreleaseVersion="$(tr -d '[:space:]' < VERSION)" publishAllPublicationsToGitHubPackagesRepository
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release/sbom.spdx.json
      - name: Collect artifacts and checksums
        run: |
          mkdir -p release/maven
          cp -R messages/build/repo/. release/maven/messages/
          printf '{"version":"%s","commit":"%s","repository":"%s"}\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_REPOSITORY" > release/metadata.json
          tar -C release -czf release/kmp-advanced-hello-world-messages-${GITHUB_REF_NAME}.tar.gz maven
          sha256sum release/*.tar.gz release/sbom.spdx.json release/metadata.json > release/SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/sbom.spdx.json
            release/metadata.json
            release/SHA256SUMS
